<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Haxball POW</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  overflow: hidden;
  background: black;
}

/* ===== FONDOS ===== */
.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

.active {
  opacity: 1;
  pointer-events: all;
}

#menu {
  background: linear-gradient(135deg, #d100ff, #00aaff);
}

.page {
  background: linear-gradient(135deg, #d100ff, #00ff00);
}

/* ===== TITULO ===== */
h1 {
  font-size: 70px;
  color: black;
  margin-bottom: 50px;
  letter-spacing: 5px;
  animation: fadeDown 1s ease;
}

/* ===== BOTONES ===== */
.btn {
  background: white;
  padding: 18px 50px;
  margin: 20px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 22px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 8px 0 #ccc;
  position: relative;
  overflow: hidden;
}

/* Hover PRO */
.btn:hover {
  transform: translateY(-12px) scale(1.03);
  box-shadow: 0 20px 30px rgba(0,0,0,0.4);
}

/* Click */
.btn:active {
  transform: translateY(0px);
  box-shadow: 0 8px 0 #ccc;
}

/* Brillo animado */
.btn::after {
  content: "";
  position: absolute;
  width: 200%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
  top: 0;
  left: -100%;
  transition: 0.5s;
}

.btn:hover::after {
  left: 100%;
}

/* ===== CARD ===== */
.card-container {
  perspective: 1000px;
}

.card {
  width: 320px;
  height: 320px;
  border-radius: 25px;
  overflow: hidden;
  transform: scale(0.8) rotateY(90deg);
  opacity: 0;
  transition: all 0.8s ease;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

.card.show {
  transform: scale(1) rotateY(0deg);
  opacity: 1;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== BOTON VOLVER ===== */
.back {
  position: absolute;
  top: 20px;
  left: 20px;
}

/* ===== ANIMACIONES ===== */
@keyframes fadeDown {
  from {
    opacity: 0;
    transform: translateY(-40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<!-- ===== MENU ===== -->
<div id="menu" class="screen active">
  <h1>POW</h1>

  <div class="btn" onclick="goTo('week')">
    PLAYER OF THE WEEK
  </div>

  <div class="btn" onclick="goTo('world')">
    WORLD PLAYER
  </div>
</div>

<!-- ===== PLAYER OF THE WEEK ===== -->
<div id="week" class="screen page">
  <div class="btn back" onclick="goTo('menu')">← Volver</div>

  <div class="card-container">
    <div class="card" id="cardWeek">
      <!-- CAMBIAR POR TU CARTA -->
      <img src="https://kappa.lol/cnmRnU">
    </div>
  </div>
</div>

<!-- ===== WORLD PLAYER ===== -->
<div id="world" class="screen page">
  <div class="btn back" onclick="goTo('menu')">← Volver</div>

  <div class="card-container">
    <div class="card" id="cardWorld">
      <!-- CAMBIAR POR TU CARTA -->
      <img src="https://kappa.lol/x908Kn">
    </div>
  </div>
</div>

<script>
function goTo(id) {
  // ocultar pantallas
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
  });

  // mostrar nueva
  const screen = document.getElementById(id);
  screen.classList.add('active');

  // animar carta si existe
  setTimeout(() => {
    let card = screen.querySelector('.card');
    if (card) {
      card.classList.remove('show');
      void card.offsetWidth; // reset animación
      card.classList.add('show');
    }
  }, 200);
}
</script>

</body>
</html>
